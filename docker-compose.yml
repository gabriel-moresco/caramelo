# Local development services.
services:
  postgres:
    # Keep the major version in sync with production (Neon, Postgres 17).
    image: postgres:17-alpine
    container_name: caramelo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: caramelo
      POSTGRES_PASSWORD: caramelo
      POSTGRES_DB: caramelo
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caramelo -d caramelo']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
